<!DOCTYPE html>
<html lang="en" data-theme="pink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexillum</title>
  <link rel="icon" type="image/png" href="assets/images/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <div class="sidebar-wrapper">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="#/quiz" class="nav-item active">Quiz</a>
          <a href="https://example.com/api-docs" class="nav-item" target="_blank" rel="noopener noreferrer">API</a>
          <a href="https://example.com/faq" class="nav-item" target="_blank" rel="noopener noreferrer">FAQ</a>
        </nav>
      </aside>
    </div>

    <!-- Main Content Area -->
    <main class="content">
      <!-- Quiz View -->
      <section id="view-quiz" class="view active">
        <div class="quiz-header-controls">
          <button id="quiz-settings-btn" class="icon-btn settings-icon-btn" aria-label="Settings"></button>
        </div>

        <h1 class="main-title">Vexillum</h1>
        
        <div class="quiz-container">
          <div id="quiz-timer-display" class="timer-display" style="display: none;">
            <span id="timer-text">10s</span>
            <div class="timer-bar-bg"><div id="timer-bar-fill" class="timer-bar-fill"></div></div>
          </div>

          <div class="flag-container">
            <img id="quiz-flag" src="" alt="Guess the Flag">
          </div>
          
          <div id="quiz-counter" class="counter">0 / 0</div>

          <div id="quiz-mcq" class="mcq-grid">
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
          </div>

          <div id="quiz-written" class="written-container" style="display: none;">
            <input type="text" id="written-input" placeholder="Enter country/region name..." autocomplete="off">
            <button id="written-submit" class="quiz-btn">Submit</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Quiz Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content modal-large">
      <h2 class="modal-title">Quiz Settings</h2>
      
      <div class="settings-grid">
        <div class="settings-col">
          <div class="setting-group">
            <h3>Categories</h3>
            <div class="checkbox-grid">
              <label class="cat-label cat-all"><input type="checkbox" id="select-all-cats" value="all"> Select All</label>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Countries & Territories</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="europe" checked> Europe <span class="pts-badge">Novice</span></label>
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="north_america" checked> N. America <span class="pts-badge">Novice</span></label>
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="south_america" checked> S. America <span class="pts-badge">Novice</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="africa" checked> Africa <span class="pts-badge">Beginner</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="asia" checked> Asia <span class="pts-badge">Beginner</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="oceania" checked> Oceania <span class="pts-badge">Beginner</span></label>
                <label class="cat-label pts-red"><input type="checkbox" name="q-cat" value="territories"> Territories <span class="pts-badge">Advanced</span></label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">States</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-orange"><input type="checkbox" name="q-cat" value="us_states"> US States <span class="pts-badge">Intermediate</span></label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Others</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="pride"> LGBTQ+ <span class="pts-badge">Beginner</span></label>
                <label class="cat-label pts-purple"><input type="checkbox" name="q-cat" value="international_organisations"> Int. Org <span class="pts-badge">Expert</span></label>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-col">
          <div class="setting-group">
            <div class="setting-header-inline">
              <h3>Timer Limit</h3>
              <button id="timer-toggle-btn" class="quiz-btn toggle-btn inactive">Timer: OFF</button>
            </div>
            <div id="timer-slider-container" class="slider-container disabled">
              <input type="range" id="timer-slider" min="2" max="20" value="10" step="1" disabled>
              <span id="timer-val-label" class="slider-val">10s</span>
            </div>
          </div>

          <div class="setting-group">
            <h3>Fun Modes</h3>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Format</h4>
              <div class="checkbox-grid">
                <label class="choice-label"><input type="radio" name="q-format" value="mcq" checked> Multiple Choice</label>
                <label class="choice-label"><input type="radio" name="q-format" value="written"> Written (Typing)</label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Progression</h4>
              <div class="checkbox-grid">
                <label class="choice-label"><input type="radio" name="q-mode" value="unique" checked> Unique Flags</label>
                <label class="choice-label"><input type="radio" name="q-mode" value="repeats"> Endless (Repeats)</label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Extras</h4>
              <div class="fun-btn-grid">
                <button class="quiz-btn fun-btn unused" disabled> Coming Soon </button>
                <button class="quiz-btn fun-btn unused" disabled> Coming Soon </button>
                <button class="quiz-btn fun-btn unused" disabled> Coming Soon </button>
              </div>
            </div>
          </div>

          <div class="setting-group">
            <div class="setting-header-inline">
              <h3>Appearance</h3>
              <button id="theme-toggle-btn" class="quiz-btn toggle-btn inactive">Dark Mode: OFF</button>
            </div>
          </div>
        </div>
      </div>

      <button id="settings-save" class="quiz-btn primary-btn">Save & Restart Quiz</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
