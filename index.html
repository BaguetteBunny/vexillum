<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexillum</title>
  <link rel="icon" type="image/png" href="assets/images/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <div class="sidebar-wrapper">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="#/quiz" class="nav-item" data-route="quiz">Quiz</a>
          <a href="#/api" class="nav-item" data-route="api">API</a>
          <a href="#/faq" class="nav-item" data-route="faq">FAQ</a>
        </nav>
      </aside>
    </div>

    <!-- Main Content Area -->
    <main class="content">
      <!-- Quiz View -->
      <section id="view-quiz" class="view">
        <div class="quiz-header-controls">
          <div id="quiz-score-badge" class="score-badge" style="display: none;">Score: <span id="outer-score-val">0</span></div>
          <button id="quiz-settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
        </div>

        <h1 class="main-title">Vexillum</h1>
        
        <div class="quiz-container">
          <div id="quiz-timer-display" class="timer-display" style="display: none;">
            <span id="timer-text">10s</span>
            <div class="timer-bar-bg"><div id="timer-bar-fill" class="timer-bar-fill"></div></div>
          </div>

          <div class="flag-container">
            <img id="quiz-flag" src="" alt="Guess the Flag">
          </div>
          
          <div id="quiz-counter" class="counter">0 / 0</div>

          <div id="quiz-mcq" class="mcq-grid">
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
            <button class="quiz-btn mcq-btn"></button>
          </div>

          <div id="quiz-written" class="written-container" style="display: none;">
            <input type="text" id="written-input" placeholder="Enter country/region name..." autocomplete="off">
            <button id="written-submit" class="quiz-btn">Submit</button>
          </div>
        </div>
      </section>

      <section id="view-api" class="view"><h2>API Documentation</h2></section>
      <section id="view-faq" class="view"><h2>Frequently Asked Questions</h2></section>
    </main>
  </div>

  <!-- Quiz Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content modal-large">
      <h2 class="modal-title">Quiz Settings</h2>
      
      <div class="settings-grid">
        <div class="settings-col">
          <div class="setting-group">
            <h3>Categories</h3>
            <div class="checkbox-grid">
              <label class="cat-label cat-all"><input type="checkbox" id="select-all-cats" value="all"> Select All</label>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Countries & Territories</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="europe" data-pts="100" checked> Europe <span class="pts-badge">100</span></label>
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="north_america" data-pts="100" checked> N. America <span class="pts-badge">100</span></label>
                <label class="cat-label pts-white"><input type="checkbox" name="q-cat" value="south_america" data-pts="100" checked> S. America <span class="pts-badge">100</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="africa" data-pts="150" checked> Africa <span class="pts-badge">150</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="asia" data-pts="150" checked> Asia <span class="pts-badge">150</span></label>
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="oceania" data-pts="150" checked> Oceania <span class="pts-badge">150</span></label>
                <label class="cat-label pts-red"><input type="checkbox" name="q-cat" value="territories" data-pts="250"> Territories <span class="pts-badge">250</span></label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">States</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-orange"><input type="checkbox" name="q-cat" value="us_states" data-pts="200"> US States <span class="pts-badge">200</span></label>
              </div>
            </div>

            <div class="cat-subgroup">
              <h4 class="cat-subgroup-title">Others</h4>
              <div class="checkbox-grid">
                <label class="cat-label pts-yellow"><input type="checkbox" name="q-cat" value="pride" data-pts="150"> LGBTQ+ <span class="pts-badge">150</span></label>
                <label class="cat-label pts-purple"><input type="checkbox" name="q-cat" value="international_organisations" data-pts="300"> Int. Org <span class="pts-badge">300</span></label>
              </div>
            </div>
          </div>

          <div class="setting-group">
            <h3>Format</h3>
            <div class="checkbox-grid">
              <label class="choice-label"><input type="radio" name="q-format" value="mcq" checked> Multiple Choice <span class="pts-badge format-badge">x1.0</span></label>
              <label class="choice-label"><input type="radio" name="q-format" value="written"> Written (Typing) <span class="pts-badge format-badge">x2.0</span></label>
            </div>
          </div>

          <div class="setting-group">
            <h3>Progression</h3>
            <div class="checkbox-grid">
              <label class="choice-label"><input type="radio" name="q-mode" value="unique" checked> Unique Flags</label>
              <label class="choice-label"><input type="radio" name="q-mode" value="repeats"> Endless (Repeats)</label>
            </div>
          </div>
        </div>

        <div class="settings-col">
          <div class="setting-group">
            <div class="setting-header-inline">
              <h3>Timer Limit <span id="timer-mult-label" class="mult-label" style="display: none;">(x2.0)</span></h3>
              <button id="timer-toggle-btn" class="quiz-btn toggle-btn inactive">Timer: OFF</button>
            </div>
            <div id="timer-slider-container" class="slider-container disabled">
              <input type="range" id="timer-slider" min="2" max="20" value="10" step="1" disabled>
              <span id="timer-val-label" class="slider-val">10s</span>
            </div>
          </div>

          <div class="setting-group">
            <h3>Fun Modes</h3>
            <div class="fun-btn-grid">
              <button id="scoring-toggle-btn" class="quiz-btn fun-btn inactive">Enable Scoring</button>
              <button class="quiz-btn fun-btn unused" disabled>Double Points</button>
              <button class="quiz-btn fun-btn unused" disabled>Sudden Death</button>
              <button class="quiz-btn fun-btn unused" disabled>Reverse Flag</button>
            </div>
          </div>

          <div class="score-card">
            <h4>Scoring Summary</h4>
            <div class="score-row">
              <span>Points per Flag:</span>
              <strong id="modal-pts-per-flag">0 pts</strong>
            </div>
            <div class="score-row">
              <span>Current Score:</span>
              <strong id="modal-current-score">0</strong>
            </div>
          </div>
        </div>
      </div>

      <button id="settings-save" class="quiz-btn primary-btn">Save & Restart Quiz</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
